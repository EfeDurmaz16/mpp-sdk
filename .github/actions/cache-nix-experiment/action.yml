name: Cache selected experimental Nix outputs
description: Reuse build outputs across runs, pruning unrooted store paths before saving.
inputs:
  mode:
    description: Restore before building, or save after the shared build succeeds.
    required: true
  scope:
    description: shared-linux or interop-swift.
    required: true
  runner-label:
    description: The explicit GitHub runner image label, required when restoring.
    default: ''
  primary-key:
    description: The original restore step's primary-key, required when saving.
    default: ''
outputs:
  primary-key:
    description: Content-derived cache key captured before the build.
    value: ${{ steps.key.outputs.primary-key }}
  hit-primary-key:
    description: Whether the action found an exact primary-key match.
    value: ${{ steps.restore.outputs.hit-primary-key }}
  restored-key:
    description: Exact or fallback cache key restored by the action.
    value: ${{ steps.restore.outputs.restored-key }}
runs:
  using: composite
  steps:
    - name: Validate cache operation
      id: validate
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_PRIMARY_KEY: ${{ inputs.primary-key }}
      run: |
        case "$CACHE_MODE" in restore|save) ;; *) exit 2 ;; esac
        case "$CACHE_SCOPE" in shared-linux|interop-swift) ;; *) exit 2 ;; esac
        if [[ "$CACHE_MODE" == save && -z "$CACHE_PRIMARY_KEY" ]]; then
          echo 'A save must use the original restore key.' >&2
          exit 2
        fi
    - name: Identify the desired Nix derivations
      id: key
      if: ${{ !cancelled() && inputs.mode == 'restore' && steps.validate.outcome == 'success' }}
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_RUNNER_LABEL: ${{ inputs.runner-label }}
      run: bash nix/scripts/cache-roots.sh key "$CACHE_SCOPE" "$CACHE_RUNNER_LABEL"
    - name: Restore selected Nix outputs
      id: restore
      if: ${{ !cancelled() && inputs.mode == 'restore' && steps.key.outcome == 'success' }}
      uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: ${{ steps.key.outputs.primary-key }}
        restore-prefixes-first-match: ${{ steps.key.outputs.restore-prefixes }}
    - name: Record cache restoration evidence
      if: ${{ !cancelled() && inputs.mode == 'restore' && steps.restore.outcome == 'success' }}
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_HIT_PRIMARY_KEY: ${{ steps.restore.outputs.hit-primary-key }}
        CACHE_RESTORED_KEY: ${{ steps.restore.outputs.restored-key }}
      run: bash nix/scripts/cache-roots.sh record "$CACHE_SCOPE"
    - name: Protect the outputs from garbage collection
      id: protect
      if: ${{ !cancelled() && inputs.mode == 'save' && steps.validate.outcome == 'success' }}
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
      run: bash nix/scripts/cache-roots.sh root "$CACHE_SCOPE"
    - name: Save the selected Nix outputs
      if: ${{ !cancelled() && inputs.mode == 'save' && steps.protect.outcome == 'success' }}
      uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: ${{ inputs.primary-key }}
        # Retain the rooted runtime closures, not all public build dependencies.
        gc-max-store-size: 0
