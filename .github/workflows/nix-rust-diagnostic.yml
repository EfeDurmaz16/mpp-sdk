name: Nix Rust compiler diagnostic

# Optional compiler evidence, separate from the SDK and browser test gates.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'EfeDurmaz16/mpp-sdk' && github.ref == 'refs/heads/experiment/nix-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-experiment
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - name: Prepare identical source, lockfile and HTML inputs
        run: python3 nix/scripts/rust-diagnostic.py prepare
      - name: Compile with native Rust on a fresh target
        id: native
        run: python3 nix/scripts/rust-diagnostic.py native
      - name: Compile with Nix Rust on a separate fresh target
        id: nix
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: >-
          nix develop --no-update-lock-file .#rust
          --command python3 nix/scripts/rust-diagnostic.py nix
      - name: Compare the controlled compiler samples
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.nix.outcome == 'success' }}
        run: python3 nix/scripts/rust-diagnostic.py compare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nix-rust-compiler-diagnostic
          path: .nix-results/rust-diagnostic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
