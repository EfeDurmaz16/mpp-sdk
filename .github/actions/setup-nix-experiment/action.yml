name: Set up the experimental Nix runner
description: Install the pinned Nix client without granting the runner daemon trust.
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
        set_as_trusted_user: false
        enable_kvm: false
    - name: Record locked inputs
      shell: bash
      run: |
        mkdir -p .nix-results
        nix --version > .nix-results/nix-version.txt
        nix eval --json --no-update-lock-file .#lib.toolVersions > .nix-results/tool-versions.json
