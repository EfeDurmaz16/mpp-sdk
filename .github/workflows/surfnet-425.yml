name: Surfnet 425 diagnosis

on:
  push:
    branches: [diag/surfnet-425-linux-20261124]

permissions:
  contents: read

jobs:
  onchain:
    if: github.repository == 'EfeDurmaz16/mpp-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Build SDK packages
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @solana/mpp build
          pnpm --filter @solana/pay-kit build
      - name: Install harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Run five fresh validators on the public datasource
        working-directory: harness
        env:
          PR_HEAD: 73a0a7170d284ccd13aa53de9243d3a2eeeb5e00
          NO_COLOR: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          helper=src/onchain/surfnet.ts
          cp "$helper" "$RUNNER_TEMP/traced.ts"
          git show "$PR_HEAD:harness/$helper" > "$RUNNER_TEMP/baseline.ts"
          echo '| Run | Mode | Suite exit |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          i=0
          for mode in baseline traced baseline traced traced; do
            i=$((i + 1))
            cp "$RUNNER_TEMP/$mode.ts" "$helper"
            log="$RUNNER_TEMP/suite-$i.log"
            status=0
            timeout 240s pnpm test:onchain > "$log" 2>&1 || status=$?
            evidence="$RUNNER_TEMP/evidence/$i-$mode.txt"
            python3 ../.github/scripts/surfnet-425-log.py "$log" > "$evidence"
            echo "| $i | $mode | $status |" >> "$GITHUB_STEP_SUMMARY"
            echo "Run $i ($mode): exit $status"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Save filtered observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfnet-425-observations
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
