name: Cache packed experimental Nix outputs
description: Store compressed per-path NARs in the fork's authenticated branch cache.
inputs:
  mode:
    description: Restore before building or save after the successful shared build.
    required: true
  scope:
    description: Unique experimental producer cache scope.
    required: true
  expected-file:
    description: Current evaluated system, runner, output roots and derivations JSON.
    required: true
  primary-key:
    description: Original restore key, required for saving.
    default: ''
outputs:
  primary-key:
    description: Exact current derivation key.
    value: ${{ steps.key.outputs.primary-key }}
  hit-primary-key:
    description: Whether the restored key exactly matches current outputs.
    value: ${{ steps.restore.outputs.cache-hit }}
  restored-key:
    description: Authenticated exact or compatible fallback key.
    value: ${{ steps.restore.outputs.cache-matched-key }}
runs:
  using: composite
  steps:
    - name: Validate packed cache operation
      id: validate
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
      run: |
        case "$CACHE_MODE" in restore|save) ;; *) exit 2 ;; esac
    - name: Identify current output roots
      id: key
      if: inputs.mode == 'restore'
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_EXPECTED_FILE: ${{ inputs.expected-file }}
      run: python3 nix/scripts/measure.py command --results .nix-results/cache-phases.jsonl --label "packed-key-$CACHE_SCOPE" -- python3 nix/scripts/binary-cache.py key "$CACHE_SCOPE" "$CACHE_EXPECTED_FILE"
    - name: Restore packed NAR files
      id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.key.outputs.cache-path }}
        key: ${{ steps.key.outputs.primary-key }}
        restore-keys: ${{ steps.key.outputs.restore-prefix }}
    - name: Authenticate cache and import compatible current roots
      if: inputs.mode == 'restore'
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_EXPECTED_FILE: ${{ inputs.expected-file }}
        CACHE_RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        GH_TOKEN: ${{ github.token }}
      run: python3 nix/scripts/measure.py command --results .nix-results/cache-phases.jsonl --label "packed-load-$CACHE_SCOPE" -- python3 nix/scripts/binary-cache.py restore "$CACHE_SCOPE" "$CACHE_EXPECTED_FILE"
    - name: Pack successful outputs
      id: pack
      if: ${{ !cancelled() && inputs.mode == 'save' && steps.validate.outcome == 'success' }}
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_EXPECTED_FILE: ${{ inputs.expected-file }}
        CACHE_PRIMARY_KEY: ${{ inputs.primary-key }}
      run: python3 nix/scripts/measure.py command --results .nix-results/cache-phases.jsonl --label "packed-save-$CACHE_SCOPE" -- python3 nix/scripts/binary-cache.py save "$CACHE_SCOPE" "$CACHE_EXPECTED_FILE"
    - name: Save packed NAR files
      if: ${{ !cancelled() && inputs.mode == 'save' && steps.pack.outcome == 'success' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .nix-work/binary-cache/${{ inputs.scope }}
        key: ${{ inputs.primary-key }}
